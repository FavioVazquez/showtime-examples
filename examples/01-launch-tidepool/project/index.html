<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidepool: launch video</title>
<script src="/_st/stage.js"></script>
<link rel="stylesheet" href="/_st/themes/neutral.css">
<link rel="stylesheet" href="fonts/inter/font.css">
<link rel="stylesheet" href="fonts/jetbrains-mono/font.css">
<script type="module" src="/_st/components/index.js"></script>
<style>
  /* Tidepool brand tokens (examples/_apps/tidepool/styles.css): teal ramp, sun, Inter + JetBrains Mono */
  :root {
    --bg: #F6F8F8; --fg: #0F1E22; --muted: #3D5157;
    --surface: #FFFFFF; --surface-2: #EEF3F3; --border: #DFE7E8;
    --accent: #0E8A8C; --accent-2: #FFB38A; --accent-ink: #FFFFFF;
    --font-display: 'Inter', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
    --weight-display: 700; --tracking-display: -0.035em; --leading-display: 1.02;
    --teal-900: #073F48; --teal-700: #0B6F78; --teal-300: #6FD0C8; --teal-50: #E8F7F6;
    --ink-teal: #0A6670; --sun: #FFB38A;
    --grain: 0.018;
  }

  /* ---------- 1. hook: dark tide-pool ground, sun from the logo, three lines, the wave draws */
  .hook { --bg: #062A2F; --fg: #F2FBFA;
    background:
      radial-gradient(38cqmin 38cqmin at 83% 20%, rgb(255 179 138 / .26), transparent 70%),
      radial-gradient(130% 110% at 78% 0%, #0B5F6B 0%, #073F48 42%, #04232A 100%); }
  .hook .sun { position: absolute; left: 83%; top: 20%; width: 9cqmin; height: 9cqmin; margin: -4.5cqmin 0 0 -4.5cqmin;
    border-radius: 50%; background: var(--sun); box-shadow: 0 0 9cqmin 2cqmin rgb(255 179 138 / .35);
    animation: sun-in 1.4s cubic-bezier(.16,1,.3,1) -.45s both; }  /* already rising at frame 0 */
  @keyframes sun-in { from { opacity: 0; transform: translateY(5cqmin) scale(.85); } }
  .hook-copy { position: absolute; left: 9cqw; top: 17cqh; color: var(--fg); }
  .hook .kicker { display: flex; align-items: center; gap: 1.8cqmin; margin: 0 0 3.4cqmin;
    font: 600 3.6cqmin/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: #B4EEE8; }
  .hook .kicker .mark { width: 5.6cqmin; height: 5.6cqmin; display: block; filter: drop-shadow(0 .4cqmin 1.2cqmin rgb(0 0 0 / .25)); }
  .hook .line { font-size: 12.6cqmin; margin: 0; line-height: 1.04; }
  .hook .line.l3 { color: var(--teal-300); }
  .hook .wave-line { position: absolute; left: -12cqw; bottom: 14cqh; width: 124cqw; height: 6cqmin; overflow: visible;
    animation: drift 2.4s linear infinite; }
  .hook .wave-line path { fill: none; stroke: #FFFFFF; stroke-width: .95cqmin; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1 1; animation: draw 1.1s cubic-bezier(.65,0,.35,1) 1.75s both; }
  .hook .wave-line.back { bottom: 10.5cqh; opacity: .35; animation-duration: 3.4s; animation-direction: reverse; }
  .hook .wave-line.back path { stroke: var(--teal-300); stroke-width: .7cqmin; animation-delay: 1.95s; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(-1 * var(--wl, 7.2cqw))); } }

  /* ---------- light scenes share the landing's ground and its two waves */
  .light { background: radial-gradient(120% 90% at 20% 0%, var(--teal-50) 0%, var(--bg) 58%); }
  .tide { position: absolute; left: -10%; width: 140%; bottom: 0; height: 15cqh; animation: tide-in 1s cubic-bezier(.16,1,.3,1) both, drift-slow 6s linear infinite; }
  .tide.t2 { height: 10cqh; animation-duration: 1.2s, 9s; animation-direction: normal, reverse; }
  @keyframes tide-in { from { translate: 0 60%; } }
  @keyframes drift-slow { from { transform: translateX(0); } to { transform: translateX(-16.667%); } }

  /* ---------- 2. reveal: the real landing page */
  /* scroll-through: the page image moves up to the landing's live app preview (16.5 % of its height, about 420 CSS px) */
  .reveal .landing { animation: page-scroll 1.5s cubic-bezier(.65,0,.35,1) 1.3s both; }
  @keyframes page-scroll { to { transform: translateY(-16.5%); } }
  /* the landing nav is sticky (styles.css .l-nav): pin its strip of the capture while the page moves under it */
  .reveal .nav-pin { position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 2880 / 130; z-index: 2;
    background: url(shots/landing-full.jpg) top center / 100% auto no-repeat; box-shadow: 0 1px 0 rgb(7 40 46 / .06); }
  .reveal .frame { position: absolute; left: 9cqw; right: 9cqw; top: 5.5cqh; bottom: 3cqh; box-shadow: 0 3cqmin 9cqmin rgb(7 40 46 / .22); border-radius: 1.4cqmin; overflow: hidden; }

  /* ---------- 3 + 4. the app itself, recorded with `showtime demo record` */
  .ui .frame { position: absolute; top: 50%; width: 66cqw; height: calc(66cqw * 10 / 16 + 7.4cqh); translate: 0 -50%;
    border-radius: 1.4cqmin; overflow: hidden; box-shadow: 0 3cqmin 9cqmin rgb(7 40 46 / .24), 0 .4cqmin 1.2cqmin rgb(7 40 46 / .1); }
  .ui-right .frame { right: 4.5cqw; }
  .ui-left .frame { left: 4.5cqw; }
  .ui .copy { position: absolute; top: 50%; translate: 0 -50%; width: 21.5cqw; display: flex; flex-direction: column; gap: 2.6cqmin; }
  .ui-right .copy { left: 6.5cqw; }
  .ui-left .copy { right: 5cqw; }
  .ui .kicker { font: 500 2.4cqmin/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-teal); margin: 0; }
  .ui .title { font-size: 6.6cqmin; margin: 0; }
  .ui .sub { font-size: 3.1cqmin; line-height: 1.32; color: var(--muted); margin: 0; }
  .vid { position: relative; }
  .vid video { display: block; width: 100%; height: auto; }
  .vid .hit { position: absolute; width: 1.2%; height: 1.9%; translate: -50% -50%; }
  .keys-host { position: relative; height: 9cqmin; margin-top: 1cqmin; }
  .keys-host .st-keystrokes { position: absolute; inset: 0 !important; align-items: flex-start; }
  .saved { display: inline-flex; align-items: center; gap: 1.2cqmin; align-self: flex-start; padding: 1.2cqmin 2cqmin; border-radius: 99cqmin;
    background: #FFFFFF; border: 1px solid var(--border); box-shadow: 0 .6cqmin 1.8cqmin rgb(7 40 46 / .08);
    font: 600 2.6cqmin/1 var(--font-body); color: var(--ink-teal);
    animation: pill-in .5s cubic-bezier(.16,1,.3,1) 3.3s both; }
  .saved .dot { width: 1.2cqmin; height: 1.2cqmin; border-radius: 50%; background: #14A3A0; box-shadow: 0 0 0 .55cqmin rgb(20 163 160 / .2); }
  @keyframes pill-in { from { opacity: 0; transform: translateY(1.2cqmin) scale(.96); } }

  /* ---------- 5. close */
  .close { --accent: #0B6F78; --logo-mark-size: 13cqmin; }
  .close .st-ec-stack { translate: 0 -4cqh; }
  .close .st-logo-word { font-size: 12cqmin; letter-spacing: -0.04em; color: var(--fg); }
  .close .st-ec-tagline { font-size: 3.6cqmin; color: var(--muted); }
  .close .st-ec-cta { font-size: 2.8cqmin; font-weight: 600; }
  .close .fiction { position: absolute; left: 0; right: 0; bottom: 17cqh; text-align: center; margin: 0;
    font: 500 3cqmin/1.3 var(--font-body); color: #3C4A4D; animation: fade-in .5s ease-out .9s both; }
  @keyframes fade-in { from { opacity: 0; } }
</style>
</head>
<body>
<div class="stage">

  <!-- 1. Hook (0-3.2): the landing page's own promise, as three refusals. Frame 0 is a still of the
       kicker and "No account." (no build-in), so feeds and embeds without a poster show a real title;
       the two other lines mask in on the voice, as before. -->
  <section class="scene hook" id="hook" data-start="0" data-dur="3.2">
    <div class="sun"></div>
    <div class="hook-copy">
      <p class="kicker" data-st="kinetic-type" data-style="none" data-at="0"><img class="mark" src="shots/logo.svg" alt="">Local-first notes</p>
      <h1 class="t-hero line l1" data-st="kinetic-type" data-style="none" data-at="0">No account.</h1>
      <h1 class="t-hero line l2" data-st="kinetic-type" data-style="mask" data-at="0.62">No server.</h1>
      <h1 class="t-hero line l3" data-st="kinetic-type" data-style="mask" data-at="1.24">No loading spinner.</h1>
    </div>
    <svg class="wave-line back" viewBox="0 0 2400 60" preserveAspectRatio="none"><path pathLength="1" data-wave="120,16"/></svg>
    <svg class="wave-line" viewBox="0 0 2400 60" preserveAspectRatio="none"><path pathLength="1" data-wave="120,20"/></svg>
  </section>

  <!-- 2. Reveal (3.2-6.6): the real landing page, scrolled down to its live app preview. -->
  <section class="scene light reveal" id="reveal" data-start="#hook" data-dur="3.4" data-transition="ripple 0.8">
    <svg class="tide" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#DDF1EF" data-fill-wave="480,40,96"/></svg>
    <div class="frame" data-st="browser-frame" data-url="localhost/tidepool" data-at="0" data-drift="none">
      <img class="landing" src="shots/landing-full.jpg" alt="">
      <div class="nav-pin"></div>
    </div>
  </section>

  <!-- 3. Search (6.6-10.8): Cmd+K, type "export", the Q4 planning note opens. Real recording. -->
  <section class="scene light ui ui-right" id="search" data-start="#reveal" data-dur="4.2" data-transition="push left 0.5">
    <svg class="tide" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#DDF1EF" data-fill-wave="480,40,96"/></svg>
    <div class="copy">
      <p class="kicker" data-st="kinetic-type" data-style="fade" data-at="0.3">Search</p>
      <h2 class="t-title title" data-st="kinetic-type" data-style="mask" data-at="0.35">Find anything.</h2>
      <p class="sub" data-st="kinetic-type" data-style="rise" data-at="0.75">Titles, text and #tags,<br>as you type.</p>
      <div class="keys-host"><div data-st="keystrokes" data-items='[{"at":0.4,"keys":"⌘ K"}]' data-hold="3.4"></div></div>
    </div>
    <div class="frame" data-st="browser-frame" data-url="localhost/tidepool" data-enter="none"
         data-zoom='[{"at":0.45,"scale":1.55,"x":50,"y":27,"dur":0.75},{"at":3.0,"scale":1.0,"x":50,"y":50,"dur":0.8}]'>
      <div class="vid"><video src="media/tidepool-demo.mp4" muted playsinline data-offset="0.3"></video></div>
    </div>
  </section>

  <!-- 4. Write (10.8-16.6): Markdown typed in split view, the task gets checked, saved locally.
       Same recording from 7.85 s, played at 1.75x. -->
  <section class="scene light ui ui-left" id="write" data-start="#search" data-dur="5.8" data-transition="push left 0.5">
    <svg class="tide" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#DDF1EF" data-fill-wave="480,40,96"/></svg>
    <div class="frame" data-st="browser-frame" data-url="localhost/tidepool" data-enter="none"
         data-zoom='[{"at":0.1,"scale":1.8,"x":100,"y":15,"dur":0.7},{"at":0.8,"scale":1.97,"x":96,"y":17,"dur":2.9},{"at":3.85,"scale":1.0,"x":50,"y":50,"dur":0.9}]'>
      <div class="vid">
        <video src="media/tidepool-demo.mp4" muted playsinline data-offset="7.85" data-rate="1.75"></video>
        <div class="hit" id="task-box" style="left:76.48%;top:29.63%"></div>
      </div>
    </div>
    <div class="copy">
      <p class="kicker" data-st="kinetic-type" data-style="fade" data-at="0.3">Write</p>
      <h2 class="t-title title" data-st="kinetic-type" data-style="mask" data-at="0.35">Markdown, previewed live.</h2>
      <div class="saved"><span class="dot"></span>Saved on this device</div>
    </div>
    <div class="layer" data-start="+2.3" data-dur="1.6">
      <div data-st="cursor" data-path='[{"at":0,"x":40,"y":78},{"at":0.85,"target":"#task-box","click":true}]' data-hide-after="0.55"></div>
    </div>
  </section>

  <!-- 5. Close (16.6-20): mark + name, the landing headline, the landing CTA, and the honest footnote. -->
  <section class="scene light close" id="close" data-start="#write" data-dur="3.4" data-transition="blur-dissolve 0.35">
    <svg class="tide t2" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#FFFFFF" data-fill-wave="480,32,112"/></svg>
    <svg class="tide" viewBox="0 0 2880 160" preserveAspectRatio="none"><path fill="#DDF1EF" data-fill-wave="480,40,96"/></svg>
    <div data-st="end-card" data-logo="shots/logo.svg" data-text="Tidepool" data-dot="false" data-style="assemble"
         data-tagline="Your notes, kept on your own machine." data-cta="Open Tidepool" data-at="0.2"></div>
    <p class="fiction">Tidepool is a fictional app, made as sample material for showtime.</p>
  </section>

  <div data-st="grain"></div>
</div>
<script>
  // Wave paths: the logo's wave (a smooth sine made of cubic curves), built once at load.
  // data-wave="wavelength,amplitude" draws a stroke; data-fill-wave="wavelength,amplitude,baseline" a filled band.
  (function () {
    function wave(len, amp, y0, width) {
      var d = 'M0 ' + y0, h = len / 2, k = h * 0.36;
      for (var x = 0, up = true; x < width; x += h, up = !up) {
        var y1 = y0 + (up ? -amp : amp);
        d += ' C' + (x + k) + ' ' + y0 + ' ' + (x + h - k) + ' ' + y1 + ' ' + (x + h) + ' ' + y1;
        y0 = y1;
      }
      return d;
    }
    document.querySelectorAll('[data-wave]').forEach(function (p) {
      var a = p.getAttribute('data-wave').split(',').map(Number);
      p.setAttribute('d', wave(a[0], a[1], 30 + a[1] / 2, 2400));
      p.closest('svg').style.setProperty('--wl', (a[0] * 124 / 2400).toFixed(3) + 'cqw');
    });
    document.querySelectorAll('[data-fill-wave]').forEach(function (p) {
      var a = p.getAttribute('data-fill-wave').split(',').map(Number);
      p.setAttribute('d', wave(a[0], a[1], a[2] - a[1] / 2, 2880) + ' V160 H0 Z');
    });
  })();
</script>
</body>
</html>
