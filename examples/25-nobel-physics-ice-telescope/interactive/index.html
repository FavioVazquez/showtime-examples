ole-label\">South Pole\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"s2-col\">\n    \u003cp class=\"s2-kicker\">Nobel Prize in Physics 2026\u003c/p>\n    \u003ch2 class=\"s2-name\">Francis Halzen\u003c/h2>\n    \u003cp class=\"s2-cite\">&ldquo;for decisive contributions to the IceCube Neutrino Observatory and the discovery of \u003cspan class=\"s2-hi\">high-energy neutrinos of astrophysical origin\u003c/span>&rdquo;\u003c/p>\n    \u003cp class=\"s2-collab\">IceCube Collaboration: about 450 people, 58&nbsp;institutions, 14&nbsp;countries\u003c/p>\n  \u003c/div>\n\u003c/section>\n  \u003csection id=\"shot-3\" class=\"scene s-shot-3\" data-start=\"#shot-2\" data-dur=\"13.25\" data-name=\"shot-3 the ghost particle\" data-transition=\"slide left 0.5\">\n  \u003cdiv class=\"s3-ground\" data-st-decor>\u003c/div>\n  \u003cdiv class=\"s3-cam\">\n    \u003cdiv class=\"s3-title\">\n      \u003cp class=\"s3-kicker\">Step 1\u003c/p>\n      \u003ch2 class=\"s3-head\">The ghost particle\u003c/h2>\n    \u003c/div>\n    \u003cdiv class=\"s3-rig\">\n      \u003csvg class=\"s3-svg s3-back\" viewBox=\"0 0 1920 1080\" aria-hidden=\"true\">\n        \u003cdefs>\n          \u003clinearGradient id=\"s3-top\" x1=\"0\" y1=\"1\" x2=\"0.4\" y2=\"0\">\n            \u003cstop offset=\"0\" stop-color=\"#58a9ff\" stop-opacity=\"0.22\"/>\u003cstop offset=\"1\" stop-color=\"#58e1ff\" stop-opacity=\"0.10\"/>\n          \u003c/linearGradient>\n          \u003clinearGradient id=\"s3-side\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            \u003cstop offset=\"0\" stop-color=\"#58a9ff\" stop-opacity=\"0.13\"/>\u003cstop offset=\"1\" stop-color=\"#58a9ff\" stop-opacity=\"0.05\"/>\n          \u003c/linearGradient>\n        \u003c/defs>\n        \u003c!-- back faces of the block: hidden edges, faint -->\n        \u003cpath class=\"s3-hidden\" d=\"M900 740 L1130 590 L1610 590 M1130 590 L1130 110\"/>\n        \u003cpolygon points=\"900,260 1130,110 1610,110 1380,260\" fill=\"url(#s3-top)\"/>\n        \u003cpol hot-8\" class=\"scene s-shot-8\" data-start=\"#shot-7\" data-dur=\"8.48\" data-name=\"6b the answer\" data-transition=\"crossfade 0.4\">\n  \u003cdiv class=\"s8-ground\" data-st-decor>\u003c/div>\n  \u003cdiv class=\"s8-toy\">our toy model\u003c/div>\n  \u003cp class=\"s8-caveat\">tuned constants: trend only, not IceCube's real aim\u003c/p>\n  \u003cdiv class=\"s8-push\">\n    \u003cdiv class=\"s8-head\">\n      \u003ch2 class=\"s8-title\">How far off the aim is, by string spacing\u003c/h2>\n      \u003cp class=\"s8-sub\">Median aiming error (our toy fit)\u003c/p>\n      \u003cp class=\"s8-cond\">same 1 km\u003csup>2\u003c/sup> of ice · 1 TeV muons · our toy model\u003c/p>\n    \u003c/div>\n    \u003csvg class=\"s8-chart\" viewBox=\"0 0 1200 560\" width=\"1200\" height=\"560\" aria-label=\"Aim error versus string spacing, our toy model\">\u003c/svg>\n    \u003cdiv class=\"s8-side\">\n      \u003cp class=\"s8-ratio-k\">Twice the spacing\u003c/p>\n      \u003cp class=\"s8-ratio\">\u003c/p>\n      \u003cdiv class=\"s8-hits\">\n        \u003cp class=\"s8-hits-k\">Sensors that see the light (median per event)\u003c/p>\n        \u003cp class=\"s8-hits-v\">\u003cspan class=\"s8-h1\">\u003c/span>\u003cspan class=\"s8-h2\">\u003c/span>\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n  \u003csection id=\"shot-9\" class=\"scene s-shot-9\" data-start=\"#shot-8\" data-dur=\"14.03\" data-name=\"7 what it found\" data-transition=\"slide left 0.5\">\n  \u003cscript src=\"assets/shot-9/event.js\">\u003c/script>\n  \u003cdiv class=\"s9-ground\" data-st-decor>\u003c/div>\n  \u003ccanvas class=\"s9-cv\" width=\"1920\" height=\"1080\" data-st-decor>\u003c/canvas>\n  \u003cdiv class=\"s9-head\">\n    \u003cp class=\"s9-kick\">Step 4\u003c/p>\n    \u003ch2 class=\"s9-title\">What it found\u003c/h2>\n  \u003c/div>\n  \u003cdiv class=\"s9-cards\">\n    \u003cdiv class=\"s9-card s9-c1\">\u003cp class=\"s9-year\">2013\u003c/p>\u003cp class=\"s9-text\">First evide if(a===null||a===undefined){setRange(null,true);return null;}

},

return readyP.then(function(){

(function wait(){

}

});
});
},

};
