<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidepool trailer</title>
<script src="/_st/stage.js"></script>
<script type="module" src="/_st/components/index.js"></script>
<link rel="stylesheet" href="fonts/inter/font.css">
<link rel="stylesheet" href="fonts/instrument-serif/font.css">
<!--
  Tidepool trailer (studio pick: C2 "Macro" + C1's sunrise ending).
  Every UI pixel is a real capture of examples/_apps/tidepool (dark theme), recorded with
  `showtime demo record` at 3840x2160 (plates/). The "camera" is a CSS 3D transform over a plate:
  keys[] per shot = {t, fx, fy (focus point in plate px), s (scale), rx/rz (tilt), ax/ay (where the
  focus sits on screen), dw/dh (depth-of-field ellipse in plate px), b (background blur)}.
  Scene times follow the composed score (audio/mix.json): downbeats 0, 2.533, 5.067, 7.6, 10.1,
  12.6 (drop: riser end + impact), 15.2 (outro); end_hit 16.47 = the name.
-->
<style>
  :root { --night: #041317; --sea: #0B4650; --teal: #14A3A0; --teal-2: #3CC5C0; --sun: #FFB38A;
          --foam: #E3EEEF; --mist: #9DB4B9; --serif: 'Instrument Serif', serif; --sans: 'Inter', sans-serif; }
  html, body { margin: 0; background: var(--night); }
  .scene { position: absolute; inset: 0; overflow: hidden; background: var(--night); }

  /* macro camera */
  .cam3d { position: absolute; inset: 0; perspective: 1500px; perspective-origin: var(--ax) var(--ay); }
  .plate { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; border-radius: 42px;
    transform-origin: calc(var(--fx) * 1px) calc(var(--fy) * 1px);
    transform: translate(calc(var(--ax) - var(--fx) * 1px), calc(var(--ay) - var(--fy) * 1px))
               rotateZ(var(--rz)) rotateX(var(--rx)) scale(var(--s)); }
  .plate img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 42px; }
  .plate .soft { filter: blur(var(--b)) brightness(.78); }
  .plate .sharp { display: none;
    -webkit-mask-image: radial-gradient(ellipse calc(var(--dw) * 1px) calc(var(--dh) * 1px) at calc(var(--mx) * 1px) calc(var(--my) * 1px), #000 38%, transparent 100%);
            mask-image: radial-gradient(ellipse calc(var(--dw) * 1px) calc(var(--dh) * 1px) at calc(var(--mx) * 1px) calc(var(--my) * 1px), #000 38%, transparent 100%); }
  .plate .sharp.on { display: block; }
  .plate.window { box-shadow: 0 0 0 4px rgba(60,197,192,.16), 0 120px 260px rgba(0,0,0,.55); }

  /* grade on every shot: amber highlights top right, teal shadows bottom left, vignette */
  .grade { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(120% 90% at 80% 8%, rgba(255,179,138,.12), transparent 55%),
                radial-gradient(110% 90% at 8% 100%, rgba(20,163,160,.15), transparent 60%); }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(125% 115% at 50% 50%, transparent 50%, rgba(2,10,12,.8) 100%); }

  /* title cards */
  .card { display: grid; place-items: center; background: radial-gradient(80% 70% at 50% 55%, #0A2F36 0%, #051B20 55%, #030D10 100%); }
  .card h2 { margin: 0; font: italic 400 148px/1.05 var(--serif); color: var(--foam); letter-spacing: -.012em; text-align: center;
             scale: calc(1 + .035 * var(--p, 0)); }

  /* reveal backdrop */
  .deep { position: absolute; inset: 0; background: radial-gradient(70% 62% at 50% 44%, #0B3139 0%, #06191E 55%, #030C0E 100%); }
  .reflect { position: absolute; left: 50%; top: 860px; width: 1500px; height: 200px; transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 0%, rgba(60,197,192,.22), transparent 70%); filter: blur(24px); }

  /* end: the app sinks below the tide line, the sun rises, the name lands on the final hit */
  /* review round 4: one wave path (set per frame in JS) is the stroke, the water's top edge and the sun's
     mask, so there is no second straight edge; the water is opaque and rises as the tide while the app sinks */
  .end .sky { position: absolute; inset: 0; background: radial-gradient(38% 42% at 50% 50%, rgba(255,179,138,.10), transparent 70%), linear-gradient(180deg, #03161B 0%, #06262D 40%, #0A3840 56%, #0B3E47 100%); }
  .end svg.sea { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .end .sunclip { position: absolute; inset: 0; clip-path: url(#above); }
  .end .sun { position: absolute; left: 960px; top: 500px; width: 156px; height: 156px; margin: -78px 0 0 -78px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #FFD2B6 0%, #FFB38A 55%, #F59C72 100%);
    box-shadow: 0 0 90px 30px rgba(255,179,138,.34), 0 0 280px 110px rgba(255,179,138,.15);
    animation: rise .82s cubic-bezier(.16,1,.3,1) .45s both, breathe 3.4s ease-in-out 1.5s both; }
  .end .pathclip { position: absolute; inset: 0; clip-path: url(#below); pointer-events: none; }
  .end .sunpath { position: absolute; left: 0; right: 0; top: 548px; height: 440px;
    background: radial-gradient(9% 70% at 50% 0%, rgba(255,179,138,.28), transparent 70%); filter: blur(6px);
    animation: fadein .9s ease-out .9s both; }
  .end svg.wave { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible;
    filter: drop-shadow(0 0 12px rgba(60,197,192,.75)); }
  .end svg.wave path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; }
  .end .name { position: absolute; left: 0; right: 0; top: 604px; text-align: center; font: 400 200px/1 var(--serif); color: #fff;
    letter-spacing: -.015em; animation: land .7s cubic-bezier(.16,1,.3,1) 1.12s both; }
  /* review round 5: tagline outranks the disclaimer (tag a touch brighter, disclaimer 36 px at the old tag colour) */
  .end .tag { position: absolute; left: 0; right: 0; top: 838px; text-align: center; font: 500 44px/1 var(--sans); color: #B4C7CA;
    animation: up .7s cubic-bezier(.16,1,.3,1) 1.75s both; }
  .end .fict { position: absolute; left: 0; right: 0; top: 921px; text-align: center; font: 500 36px/1 var(--sans); color: #9FB3B6;
    letter-spacing: .005em; animation: up .6s cubic-bezier(.16,1,.3,1) 2.15s both; }
  .end .out { animation: fadeout .8s cubic-bezier(.4,0,.2,1) both; }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes rise { from { transform: translateY(170px); } }
  @keyframes breathe { 50% { box-shadow: 0 0 110px 40px rgba(255,179,138,.40), 0 0 320px 130px rgba(255,179,138,.18); } }
  @keyframes land { from { opacity: 0; filter: blur(18px); transform: translateY(26px) scale(1.04); } }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } }
</style>
</head>
<body>
  <!-- 1 · hook: the app's own status line, in macro -->
  <section class="scene shot" id="hook" data-start="0" data-dur="2.533" data-plate="app-welcome"></section>
  <!-- 2 · card -->
  <section class="scene card" id="card1" data-start="#hook" data-dur="1.767">
    <h2 data-st="kinetic-type" data-style="blur" data-by="words" data-at="0" data-dur="0.4">Everything you write</h2>
  </section>
  <!-- 3 · the palette finds "export" (real typing, one captured frame per letter) -->
  <section class="scene shot" id="find" data-start="#card1" data-dur="1.7" data-plate="pal-7"></section>
  <!-- 4 · a task ticks in the preview, then "Saved on this device" -->
  <section class="scene shot" id="tick" data-start="#find" data-dur="1.6" data-plate="q4-open"></section>
  <!-- 5 · card, on the build's first downbeat -->
  <section class="scene card" id="card2" data-start="#tick" data-dur="1.875">
    <h2 data-st="kinetic-type" data-style="blur" data-by="words" data-at="0" data-dur="0.4">stays on your device.</h2>
  </section>
  <!-- 6 · fragments (no product name until the end), one per beat, accelerating into the drop -->
  <section class="scene shot" id="f-saved" data-start="#card2" data-dur="0.625" data-plate="app-welcome"></section>
  <section class="scene shot" id="f-cmdk" data-start="#f-saved" data-dur="0.625" data-plate="app-welcome"></section>
  <section class="scene shot" id="f-link" data-start="#f-cmdk" data-dur="0.625" data-plate="app-welcome"></section>
  <section class="scene shot" id="f-tag" data-start="#f-link" data-dur="0.625" data-plate="q4-ticked"></section>
  <section class="scene shot" id="f-local" data-start="#f-tag" data-dur="0.3125" data-plate="app-welcome"></section>
  <section class="scene shot" id="f-now" data-start="#f-local" data-dur="0.3125" data-plate="q4-ticked"></section>
  <!-- 7 · the drop: back on "Sync: local only" (held 0.3 s), then all the way out to the whole app.
       app-reveal is the same app with the Q4 note open, so only the sidebar logo shows the name before the end card -->
  <section class="scene shot" id="reveal" data-start="12.6" data-dur="2.6" data-plate="app-reveal" data-window>
  </section>
  <!-- 8 · the tide: the app sinks, the sun rises, the name lands on the score's final hit (16.47 s) -->
  <section class="scene shot end" id="end" data-start="#reveal" data-plate="app-reveal" data-window>
    <div class="sky"></div>
  </section>

  <div data-st="grain" data-opacity="0.06" data-fps="24"></div>

<script>
(function () {
  // ---- shots: camera keys in shot-local seconds ------------------------------------------------
  // defaults: ax 960, ay 540, rx 0, rz 0, dw 900, dh 240, b 9, mx/my = fx/fy
  var SHOTS = {
    hook: { keys: [
      { t: 0,     fx: 238, fy: 2075, s: 2.18, rx: 34, rz: -8.5, ax: 830, ay: 612, dw: 640, dh: 150, b: 10 },
      { t: 2.533, fx: 330, fy: 2073, s: 2.85, rx: 29, rz: -5.5, ax: 915, ay: 585, dw: 700, dh: 150, b: 10, e: 'sine' } ] },
    find: { states: [[0, 'pal-0'], [0.16, 'pal-1'], [0.27, 'pal-2'], [0.38, 'pal-3'], [0.49, 'pal-4'], [0.6, 'pal-5'], [0.71, 'pal-6'], [1.21, 'pal-7']],
      keys: [
      { t: 0,    fx: 1240, fy: 862,  s: 2.05, rx: 24, rz: 4, ax: 700, ay: 620, dw: 900, dh: 170, b: 9 },
      { t: 0.8, fx: 1330, fy: 866,  s: 2.12, rx: 24, rz: 4, ax: 700, ay: 620, dw: 900, dh: 170, b: 9, e: 'sine' },
      { t: 1.4, fx: 2074, fy: 1175, s: 1.85, rx: 20, rz: 4.5, ax: 1010, ay: 560, dw: 1150, dh: 230, b: 8, e: 'camera' },
      { t: 1.7,  fx: 2110, fy: 1178, s: 1.9, rx: 20, rz: 4.5, ax: 1010, ay: 560, dw: 1150, dh: 230, b: 8, e: 'sine' } ] },
    tick: { states: [[0, 'q4-open'], [0.3, 'q4-ticked']],
      keys: [
      { t: 0,    fx: 3060, fy: 2034, s: 2.0, rx: 27, rz: -5, ax: 700, ay: 600, dw: 820, dh: 170, b: 9 },
      { t: 0.5,  fx: 3100, fy: 2036, s: 2.08, rx: 27, rz: -5, ax: 720, ay: 600, dw: 820, dh: 170, b: 9, e: 'sine' },
      { t: 0.95, fx: 3590, fy: 2108, s: 2.2, rx: 27, rz: -5, ax: 1020, ay: 600, dw: 820, dh: 150, b: 9, e: 'camera' },
      { t: 1.6,  fx: 3605, fy: 2108, s: 2.24, rx: 27, rz: -5, ax: 1020, ay: 600, dw: 820, dh: 150, b: 9, e: 'sine' } ] },
    'f-saved': { keys: [
      { t: 0,     fx: 3250, fy: 800, s: 2.1,  rx: 20, rz: -4, ax: 930, ay: 380, dw: 1100, dh: 170 },
      { t: 0.625, fx: 3320, fy: 800, s: 2.22, rx: 20, rz: -4, ax: 960, ay: 380, dw: 1100, dh: 170, e: 'sine' } ] },
    'f-cmdk': { keys: [
      { t: 0,     fx: 620, fy: 380, s: 3.3, rx: 26, rz: 7, ax: 1320, ay: 560, dw: 520, dh: 150 },
      { t: 0.625, fx: 660, fy: 380, s: 3.55, rx: 26, rz: 7, ax: 1320, ay: 560, dw: 520, dh: 150, e: 'sine' } ] },
    'f-link': { keys: [
      { t: 0,     fx: 2330, fy: 2024, s: 2.3, rx: 30, rz: -5, ax: 900, ay: 560, dw: 900, dh: 140 },
      { t: 0.625, fx: 2470, fy: 2024, s: 2.45, rx: 30, rz: -5, ax: 900, ay: 560, dw: 900, dh: 140, e: 'sine' } ] },
    'f-tag': { keys: [
      { t: 0,     fx: 2270, fy: 410, s: 3.0, rx: 22, rz: 3, ax: 960, ay: 540, dw: 520, dh: 140 },
      { t: 0.625, fx: 2320, fy: 410, s: 3.25, rx: 22, rz: 3, ax: 960, ay: 540, dw: 520, dh: 140, e: 'sine' } ] },
    'f-local': { keys: [
      { t: 0,      fx: 1100, fy: 1797, s: 2.5, rx: 24, rz: -6, ax: 960, ay: 540, dw: 1000, dh: 150 },
      { t: 0.3125, fx: 1160, fy: 1797, s: 2.65, rx: 24, rz: -6, ax: 960, ay: 540, dw: 1000, dh: 150, e: 'sine' } ] },
    'f-now': { keys: [
      { t: 0,      fx: 1560, fy: 755, s: 3.0, rx: 22, rz: 5, ax: 960, ay: 540, dw: 700, dh: 140 },
      { t: 0.3125, fx: 1600, fy: 755, s: 3.2, rx: 22, rz: 5, ax: 960, ay: 540, dw: 700, dh: 140, e: 'sine' } ] },
    reveal: { keys: [
      { t: 0,    fx: 250,  fy: 2075, s: 2.35, rx: 32, rz: -7, ax: 900, ay: 600, dw: 640, dh: 150, b: 10 },
      { t: 0.3,  fx: 262,  fy: 2075, s: 2.42, rx: 32, rz: -7, ax: 905, ay: 600, dw: 660, dh: 150, b: 10, e: 'sine' },
      { t: 1.55, fx: 1920, fy: 1080, s: 0.415, rx: 9, rz: 0, ax: 960, ay: 522, dw: 5200, dh: 4200, b: 0, e: 'whip' },
      { t: 2.6,  fx: 1920, fy: 1080, s: 0.392, rx: 7, rz: 0, ax: 960, ay: 530, dw: 5200, dh: 4200, b: 0, e: 'sine' } ] },
    end: { keys: [
      { t: 0,    fx: 1920, fy: 1080, s: 0.392, rx: 7, rz: 0, ax: 960, ay: 530, dw: 5200, dh: 4200, b: 0 },
      { t: 0.8,  fx: 1920, fy: 1080, s: 0.35,  rx: 12, rz: 0, ax: 960, ay: 1220, dw: 5200, dh: 4200, b: 0, e: 'camera' },
      { t: 4.8,  fx: 1920, fy: 1080, s: 0.35,  rx: 12, rz: 0, ax: 960, ay: 1220, dw: 5200, dh: 4200, b: 0 } ] }
  };

  var E = {
    sine: function (p) { return -(Math.cos(Math.PI * p) - 1) / 2; },
    camera: function (p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
    expo: function (p) { return p >= 1 ? 1 : 1 - Math.pow(2, -9 * p); },
    // review round 5: the pull-back eases in over its first ~0.37 s of progress, then decelerates like expo (c 7);
    // peak ~270 px/frame at ~13.10 s (on the whoosh) instead of ~680 px on the first frame
    whip: function (p) {
      if (p >= 1) return 1;
      var k = 0.3, c = 7, w = p < k ? p * p / (2 * k) : p - k / 2;
      return (1 - Math.pow(2, -c * w / (1 - k / 2))) / (1 - Math.pow(2, -c));
    }
  };
  // screen-space speed of the camera (px per frame, 2D approximation at three screen points) -> motion blur
  function speedPx(keys, lt) {
    var c0 = camAt(keys, lt - 1 / 30), c1 = camAt(keys, lt), m = 0;
    [[960, 540], [300, 300], [1600, 800]].forEach(function (S) {
      var px = (S[0] - c0.ax) / c0.s + c0.fx, py = (S[1] - c0.ay) / c0.s + c0.fy;
      m = Math.max(m, Math.hypot(c1.ax + (px - c1.fx) * c1.s - S[0], c1.ay + (py - c1.fy) * c1.s - S[1]));
    });
    return m;
  }
  var NUM = ['fx', 'fy', 's', 'rx', 'rz', 'ax', 'ay', 'dw', 'dh', 'b', 'mx', 'my'];
  function fill(k) {
    var o = { ax: 960, ay: 540, rx: 0, rz: 0, dw: 900, dh: 240, b: 9 };
    for (var n in k) o[n] = k[n];
    if (o.mx == null) o.mx = o.fx; if (o.my == null) o.my = o.fy;
    return o;
  }
  function camAt(keys, t) {
    if (t <= keys[0].t) return keys[0];
    for (var i = 0; i < keys.length - 1; i++) {
      var a = keys[i], b = keys[i + 1];
      if (t <= b.t) {
        var p = (E[b.e || 'camera'])((t - a.t) / (b.t - a.t)), o = {};
        NUM.forEach(function (n) { o[n] = a[n] + (b[n] - a[n]) * p; });
        return o;
      }
    }
    return keys[keys.length - 1];
  }

  // ---- build the DOM for each shot -------------------------------------------------------------
  var loads = [];
  function img(src, cls) {
    var i = new Image(); i.src = 'plates/' + src + '.jpg'; i.className = cls; i.alt = '';
    loads.push(i.decode().catch(function () {}));
    return i;
  }
  var shots = [];
  document.querySelectorAll('section.shot').forEach(function (sec) {
    var cfg = SHOTS[sec.id]; cfg.keys = cfg.keys.map(fill);
        if (sec.id === 'reveal' || sec.id === 'end') {
      var deep = document.createElement('div'); deep.className = 'deep';
      var refl = document.createElement('div'); refl.className = 'reflect';
      if (sec.id === 'reveal') { sec.appendChild(deep); sec.appendChild(refl); }
      else { deep.classList.add('out'); refl.classList.add('out'); sec.querySelector('.sky').after(deep, refl); }
    }
    var cam = document.createElement('div'); cam.className = 'cam3d';
    var plate = document.createElement('div'); plate.className = 'plate' + (sec.hasAttribute('data-window') ? ' window' : '');
    var states = cfg.states || [[0, sec.dataset.plate]];
    plate.appendChild(img(states[states.length - 1][1], 'soft'));
    var sharp = {};
    states.forEach(function (s) { if (!sharp[s[1]]) { sharp[s[1]] = img(s[1], 'sharp'); plate.appendChild(sharp[s[1]]); } });
    cam.appendChild(plate);
    var anchor = sec.querySelector('.reflect') || sec.querySelector('.sky');
    if (anchor && sec.id === 'end') anchor.after(cam); else sec.appendChild(cam);
    if (sec.id !== 'end') {
      ['grade', 'vignette'].forEach(function (c) { var d = document.createElement('div'); d.className = c; sec.appendChild(d); });
    }
    shots.push({ sec: sec, cfg: cfg, cam: cam, plate: plate, sharp: sharp, states: states });
  });
  // end scene overlays (after the sinking app): water, sun, wave line, name
  var endSec = document.getElementById('end');
  endSec.insertAdjacentHTML('beforeend',
    '<svg class="sea" viewBox="0 0 1920 1080"><defs>' +
      '<linearGradient id="seafill" x1="0" y1="540" x2="0" y2="1080" gradientUnits="userSpaceOnUse">' +
      '<stop offset="0" stop-color="#0A3A42"/><stop offset=".35" stop-color="#052329"/><stop offset="1" stop-color="#031419"/></linearGradient>' +
      '<clipPath id="above" clipPathUnits="userSpaceOnUse"><path class="wv-above"/></clipPath>' +
      '<clipPath id="below" clipPathUnits="userSpaceOnUse"><path class="wv-below"/></clipPath></defs>' +
      '<path class="wv-below" fill="url(#seafill)"/></svg>' +
    '<div class="pathclip"><div class="sunpath"></div></div>' +
    '<svg class="wave" viewBox="0 0 1920 1080"><path class="wv-line"/></svg>' +
    '<div class="name">Tidepool</div><div class="tag">Your notes, kept on your own machine.</div>' +
    '<div class="fict">Tidepool is a fictional app: showtime sample material.</div>' +
    '<div class="grade"></div><div class="vignette" style="opacity:.8"></div>');
  // the sun sits behind the sinking app and under the (opaque) water, so it only ever shows above the tide line
  var sunclip = document.createElement('div'); sunclip.className = 'sunclip'; sunclip.innerHTML = '<div class="sun"></div>';
  endSec.querySelector('.reflect').after(sunclip);
  ST.waitFor(Promise.all(loads), 'plates');

  // the tide line: crest/trough every 160 px (as the round-3 stroke), drifting 60 px over the card,
  // rising from below the frame to its rest line while the app sinks (end-local 0 -> 0.55 s)
  var WV_REST = 562, WV_FROM = 1150, WV_RISE = 0.55, WV_AMP = 14;
  function waveD(yb, ph) {
    var x = -320 + (ph % 320), up = true, d = 'M' + x.toFixed(1) + ' ' + (yb + WV_AMP);
    for (; x < 2240; x += 160) {
      var y1 = up ? yb + WV_AMP : yb - WV_AMP, y2 = up ? yb - WV_AMP : yb + WV_AMP;
      d += ' C' + (x + 80).toFixed(1) + ' ' + y1 + ' ' + (x + 80).toFixed(1) + ' ' + y2 + ' ' + (x + 160).toFixed(1) + ' ' + y2;
      up = !up;
    }
    return { line: d, xe: x };
  }
  var wvLine = endSec.querySelector('.wv-line'), wvBelow = endSec.querySelectorAll('.wv-below'), wvAbove = endSec.querySelector('.wv-above');
  function setWave(lt) {
    var p = Math.min(1, Math.max(0, lt / WV_RISE)), e = 1 - Math.pow(1 - p, 3);
    var yb = WV_FROM + (WV_REST - WV_FROM) * e, w = waveD(yb, -60 * Math.max(0, lt) / 4.8);
    wvLine.setAttribute('d', w.line);
    var below = w.line + ' L' + w.xe + ' 1400 L-700 1400 Z', above = w.line + ' L' + w.xe + ' -400 L-700 -400 Z';
    wvBelow.forEach(function (el) { el.setAttribute('d', below); });
    wvAbove.setAttribute('d', above);
  }
  setWave(0);

  var clipStart = {};
  ST.onSeek(function (t) {
    if (!clipStart.hook) ST.clips().forEach(function (c) { if (c.id) clipStart[c.id] = c; });
    shots.forEach(function (sh) {
      var c = clipStart[sh.sec.id]; if (!c) return;
      var lt = t - c.start;
      var cend = c.end == null ? Infinity : c.end;
      if (lt < -0.001 || (t >= cend + 0.0001 && cend < ST.info().duration)) return;
      var k = camAt(sh.cfg.keys, lt);
      // a breath of handheld drift so no frame is ever locked off
      var hx = ST.noise(t * 0.7, 11) * 4, hy = ST.noise(t * 0.6, 23) * 3;
      var st = sh.plate.style, cs = sh.cam.style;
      cs.setProperty('--ax', (k.ax + hx) + 'px'); cs.setProperty('--ay', (k.ay + hy) + 'px');
      st.setProperty('--ax', (k.ax + hx) + 'px'); st.setProperty('--ay', (k.ay + hy) + 'px');
      st.setProperty('--fx', k.fx); st.setProperty('--fy', k.fy); st.setProperty('--s', k.s);
      st.setProperty('--rx', k.rx + 'deg'); st.setProperty('--rz', k.rz + 'deg');
      st.setProperty('--dw', k.dw); st.setProperty('--dh', k.dh); st.setProperty('--b', k.b + 'px');
      st.setProperty('--mx', k.mx); st.setProperty('--my', k.my);
      var cur = sh.states[0][1];
      sh.states.forEach(function (s) { if (lt >= s[0]) cur = s[1]; });
      for (var n in sh.sharp) sh.sharp[n].classList.toggle('on', n === cur);
      if (sh.sec.id === 'end') setWave(lt);
      // motion blur on the whip only (reveal shot): 0 below ~80 px/frame, up to 4 px at the peak
      if (sh.sec.id === 'reveal') cs.filter = 'blur(' + Math.min(4, Math.max(0, (speedPx(sh.cfg.keys, lt) - 80) / 45)).toFixed(2) + 'px)';
    });
  });
})();
</script>
